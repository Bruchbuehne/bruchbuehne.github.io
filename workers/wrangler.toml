# Cloudflare Workers configuration for Bruchbühne Reservations
# Simplified KV-based system (no D1, no Google Sheets sync)

name = "bruchbuehne-reservations"
main = "kv-reservation-worker.js"
compatibility_date = "2024-01-01"

[[routes]]
pattern = "bruchbuehne.de/api*"
zone_name = "bruchbuehne.de"

[[routes]]
pattern = "bruchbuehne.de/admin*"
zone_name = "bruchbuehne.de"

# KV Namespace binding
[[kv_namespaces]]
binding = "RESERVATIONS"
id = "95e615fa11f841d7a02aede5acf98eda"

# Secrets (set via: wrangler secret put SECRET_NAME)
# Required:
#   ADMIN_TOKEN - for admin API access
#   RESEND_API_KEY - for sending confirmation emails via Resend
